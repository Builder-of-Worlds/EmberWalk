<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Box route beat</title>
    <link rel="icon" href="data:," />
    <style>
      :root {
        --night: #16130f;
        --paper: #efeae0;
        --ember: #e8833a;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--night);
      }
      body {
        color: var(--paper);
        font: 600 clamp(1rem, 2.4vw, 1.75rem) / 1.3 system-ui, sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100%;
        display: grid;
        place-content: center;
        gap: 1.25rem;
        padding: 16px;
      }
      .frame {
        position: relative;
        width: min(100%, calc((100svh - 10rem) * 16 / 9));
        aspect-ratio: 16 / 9;
        margin: 0 auto;
        overflow: hidden;
        border-radius: 0.75rem;
        box-shadow: 0 1.5rem 4rem rgb(0 0 0 / 0.55);
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .marker {
        position: absolute;
        box-sizing: border-box;
        border: 3px solid var(--ember);
        border-radius: 0.375rem;
        box-shadow: 0 0 0 2px rgb(22 19 15 / 0.6);
        opacity: 0;
        pointer-events: none;
      }
      .words {
        min-height: 3.2em;
        text-align: center;
      }
      .line {
        margin: 0;
        opacity: 0;
        transition: opacity 900ms cubic-bezier(0.22, 1, 0.36, 1);
      }
      .line.second {
        color: var(--ember);
      }
      .line.shown {
        opacity: 1;
      }
      @media (prefers-reduced-motion: reduce) {
        .line {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="frame">
        <video playsinline preload="auto"></video>
        <div class="marker"></div>
      </div>
      <div class="words" aria-live="polite">
        <p class="line first"></p>
        <p class="line second"></p>
      </div>
    </main>
    <script type="module" src="/src/beat/box-route-main.ts"></script>
  </body>
</html>
